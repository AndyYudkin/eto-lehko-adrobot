services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adrobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adrobot}
      POSTGRES_DB: ${POSTGRES_DB:-adrobot}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # built from the POSTGRES_* above, so the password is set in one place
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adrobot}:${POSTGRES_PASSWORD:-adrobot}@db:5432/${POSTGRES_DB:-adrobot}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      # the only port exposed: the app is at http://localhost:${APP_PORT}
      - '${APP_PORT:-8080}:4173'

volumes:
  pgdata:
